appId: org.ait4x.easelclient
directories:
  output: release
files:
  - src/**/*
  - canvas-kits/*.js
  - packages/media-mcp/dist/**/*
  - packages/media-mcp/package.json
  - .agents/skills/**/*
  - package.json
  - LICENSE
  - NOTICE
  - licenses/**/*
  - docs/license-audit.md
  - docs/license-inventory.json
  - packages/media-mcp/LICENSE
  - packages/media-mcp/NOTICE
asar: true
asarUnpack:
  - packages/media-mcp/dist/**/*
  - packages/media-mcp/package.json
  # The MCP child uses ESM imports, which require dependencies on disk.
  - node_modules/**/*
afterPack: scripts/check-packaged-media-mcp.js
afterSign: scripts/check-signed-media-mcp.js
extraResources:
  - from: build/icon.png
    to: app-icon.png
extraMetadata:
  main: src/main.js
npmRebuild: false
publish: null
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
mac:
  icon: build/icon.icns
  identity: "-"
  hardenedRuntime: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Easel canvases can use your camera when you allow access.
    NSMicrophoneUsageDescription: Easel canvases can use your microphone when you allow access.
  target:
    - dmg
    - zip
dmg:
  sign: false
linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Graphics
  maintainer: "Giovanni Lion <giovanni.lion@gmail.com>"
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
productName: Easel Studio

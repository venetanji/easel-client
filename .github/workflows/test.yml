name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          EASEL_RUN_BROWSER_TESTS: '1'
      - run: npm run build
      - name: Configure Electron sandbox helper on disposable CI
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          node scripts/ci-electron-sandbox-helper.cjs --preflight
          node node_modules/electron/install.js
          helper="$(node scripts/ci-electron-sandbox-helper.cjs)"
          sudo chown root:root -- "$helper"
          sudo chmod 4755 -- "$helper"
          test "$(stat -c '%u:%g:%a' -- "$helper")" = "0:0:4755"
      - name: Verify constrained offline Strudel runtime
        timeout-minutes: 2
        run: xvfb-run -a node scripts/probe-strudel-runtime.cjs
      - name: Retain Strudel runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strudel-runtime-evidence
          path: |
            /tmp/easel-strudel-probe-*/electron.log
            /tmp/easel-strudel-probe-*/stages.log
            /tmp/easel-strudel-probe-*/evidence.json
          if-no-files-found: ignore
      - name: Verify offline video composition and export
        run: xvfb-run -a npm run test:video-export
      - name: Verify native editor preview geometry
        run: xvfb-run -a sh -c 'EASEL_UI_TEST_DISPLAY="$DISPLAY" node --test --test-name-pattern="browser preview frame preserves" test/video-timeline-view.test.js'
      - name: Verify native editor selection and media drops
        run: xvfb-run -a node scripts/smoke-video-editor.cjs
      - name: Verify native timeline direct controls and stacking parity
        run: xvfb-run -a node scripts/smoke-timeline-controls.cjs

  server-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Deliberately fail if this repository's existing token cannot read the
      # private server. Do not skip the contract or create new credentials.
      - uses: actions/checkout@v4
        with:
          repository: venetanji/easel
          ref: 4c114e5642c7db875ffafb3ae3c70a21183032ad
          path: contract-server
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install audio contract tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify audio executables
        run: command -v ffmpeg && command -v ffprobe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/media-mcp
      - name: Verify production Media MCP against pinned server
        working-directory: contract-server
        env:
          EASEL_MEDIA_MCP_SOURCE: ${{ github.workspace }}
        run: uv run --group dev pytest -q -rs tests/test_mcp_contract.py
